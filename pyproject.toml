[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "refinerec"
version = "0.1.0"
description = "RefineRec: Iterative Latent Refinement for Sequential Recommendation in PyTorch & PyTorch Lightning"
readme = "README.md"
authors = [
    { name = "Chris Olande" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
    "recommender-systems",
    "sequential-recommendation",
    "pytorch",
    "pytorch-lightning",
    "deep-learning",
    "latent-dynamics",
    "recursive-refinement",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "torch>=2.0.0",
    "pytorch-lightning>=2.0.0",
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "jupyter>=1.0.0",
]
hpo = [
    "optuna>=3.0.0",
    "wandb>=0.15.0",
]
automation = [
    "optuna>=3.0.0",
    "wandb>=0.15.0",
    "wandb-workspaces>=0.4.0",
    "PyYAML>=6.0",
]


[project.urls]
Homepage = "https://github.com/Chrisolande/recursive-refinement-recsys"
Repository = "https://github.com/Chrisolande/recursive-refinement-recsys.git"

[project.scripts]
refinerec-train = "refinerec.training.trainer:main"
recrec-train = "refinerec.training.trainer:main"
refinerec-final-automation = "automation.final_automation:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["refinerec*", "automation*"]


[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
